# DentSimco — Şirket sıralaması botu
# Her gün 09:23 UTC'de (12:23 TR) ve istediğin zaman elle çalışır. Simcotools sıralamasının ayrıntıları sayfa sayfa
# sabaha doğru dolar (son sayfalar ~07:40 UTC), bu yüzden bot öğleye yakın başlar. İki realm için ~520 istek (saniyede en çok 2), ~5 dakika.
# Güvenlik: GitHub eylemi değişmez commit numarasıyla (SHA) çağrılır.
name: DentSimco Siralama

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dentsimco-siralama
  cancel-in-progress: false

jobs:
  siralama:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: bot
      - name: Sınama (başarısız olursa uyarı verir, veri toplamayı durdurmaz)
        continue-on-error: true
        run: node bot/ranking_test.mjs
      - name: Sıralamayı topla
        run: node bot/ranking.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
