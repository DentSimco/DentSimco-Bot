# DentSimco — Şirket sıralaması botu (YALNIZ ELLE)
# Günlük çalışma borsa.yml içindedir (borsa turundan sonra, aynı işte) ki Simcotools'a iki iş birden istek atmasın.
# Bu iş elle (Actions > Run workflow) çalıştırılır ve borsa ile AYNI kuyruğu (concurrency) paylaşır: borsa turu sürerken sıra bekler.
# Not: borsa ve bu iş aynı kuyrukta olduğundan bekleyen en yeni çalışma öncekini iptal eder; elle çalıştırınca borsa turu atlanabilir.
# Güvenlik: GitHub eylemi değişmez commit numarasıyla (SHA) çağrılır.
name: DentSimco Siralama

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dentsimco-borsa
  cancel-in-progress: false

jobs:
  siralama:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: bot
      - name: Sınama (başarısız olursa veri yine toplanır, iş sonunda kırmızı biter)
        id: ranking-test
        continue-on-error: true
        run: node bot/ranking_test.mjs
      - name: Sıralamayı topla
        run: node bot/ranking.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Sınama başarısızsa işi kırmızıya çevir (veri yukarıda toplandı; bildirim gelsin)
        if: ${{ always() && (steps.ranking-test.outcome == 'failure') }}
        run: |
          echo "::error::Sınama başarısız (ranking-test); ayrıntı ilgili adımda."
          exit 1
