# DentSimco — Şirket geçmişi geri doldurma (ilk 30 gün; tek seferlik, kaldığı yerden devam eder)
# Günlük geçmiş birikimi siralama.yml içinde, sıralamadan sonra yapılır (bot/history.mjs). Bu iş, Simcotools'un şirket geçmişi API'sinden
# ilk 30 günü doldurur: şirket başına bir istek, değere göre en değerliden başlar, ≈1 istek/sn.
# Her çalışma en çok 5 saat sürer ve ilerlemesini Firestore'a yazar; sonraki çalışma kaldığı yerden sürer. Bitince ya da günlük
# geçmiş 30 güne tamamlanınca hiçbir şey yapmadan biter. Elle (Actions > Run workflow) ya da her gece kendiliğinden çalışır.
# Borsa kuyruğundan (dentsimco-borsa) AYRIDIR: saatler süren bu iş borsa turlarını bekletmesin diye. Aynı Simcotools sınırını paylaştıkları
# için bot yavaş çalışır ve 429 alınca kendiliğinden yavaşlar.
# Güvenlik: GitHub eylemi değişmez commit numarasıyla (SHA) çağrılır.
name: DentSimco Siralama Gecmis

on:
  schedule:
    - cron: '40 19 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Değere göre ilk kaç şirket (boş = hepsi; sınırlı çalışma bitmiş sayılmaz, sonraki çalışma sürer)'
        required: false
        default: ''
      realms:
        description: 'Hangi realmlar (0 = R1, 1 = R2; 0,1 = ikisi sırayla; boş = şimdilik yalnız 0)'
        required: false
        default: ''
      rate:
        description: 'Saniyedeki istek sayısı (boş = otomatik, ≈2-3; örn. 5). 429 gelirse kendiliğinden yavaşlar'
        required: false
        default: ''
      since:
        description: 'Bu günden itibaren doldur (YYYY-MM-DD; boş = 2026-09-29)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: dentsimco-gecmis
  cancel-in-progress: false

jobs:
  gecmis:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: bot
      - name: Sınama (başarısız olursa veri yine toplanır, iş sonunda kırmızı biter)
        id: history-test
        continue-on-error: true
        run: node bot/history_test.mjs
      - name: Geçmişi geri doldur
        run: node bot/history_backfill.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          BACKFILL_LIMIT: ${{ inputs.limit }}
          BACKFILL_RATE: ${{ inputs.rate }}
          # Boş bırakılırsa (gece çalışması dahil) şimdilik yalnız R1 (0): R1 bitince '1' girilerek ya da bu varsayılan değiştirilerek R2'ye geçilir
          BACKFILL_REALMS: ${{ inputs.realms || '0' }}
          # Boş bırakılırsa (gece çalışması dahil) 29 Eylül'den itibaren doldurulur; son 30 günün dışına çıkmaz
          BACKFILL_SINCE: ${{ inputs.since || '2026-09-29' }}
      - name: Sınama başarısızsa işi kırmızıya çevir (veri yukarıda toplandı; bildirim gelsin)
        if: ${{ always() && (steps.history-test.outcome == 'failure') }}
        run: |
          echo "::error::Sınama başarısız (history-test); ayrıntı ilgili adımda."
          exit 1
