# DentSimco — Haber masası (Claude API)
# Günde bir kez çalışır: 05:00 UTC = TR 08:00 (Türkiye UTC+3, yaz saati yok) ve istediğin zaman elle.
# Not: GitHub zamanlanmış işleri yoğun saatlerde birkaç dakika geciktirebilir.
# Simcotools'a istek ATMAZ (yalnız Firestore'daki veriyi okur), bu yüzden borsa botunun hız sınırını etkilemez.
# Gerekli secret'lar: ANTHROPIC_API_KEY (Claude API anahtarı) ve FIREBASE_SERVICE_ACCOUNT_JSON (borsa botununkiyle aynı).
# Güvenlik: GitHub eylemleri değişmez commit numarasıyla (SHA) çağrılır; npm paketi kurulum betikleri kapalı kurulur.
# Claude SDK'sı SDK_VERSION'daki sürüme SABİTLENDİ (ANTHROPIC_API_KEY ve Firebase anahtarı bu paketin çalıştığı adımda durur;
# 'latest' kurulursa yarın yayınlanacak bir sürüm bu gizli bilgileri görürdü). Yükseltmek için sürümü bilerek değiştir:
# önce Actions > DentSimco Haber > Run workflow ile dene. Boş bırakılırsa kurulum hata verir.
name: DentSimco Haber

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dentsimco-haber
  cancel-in-progress: false

env:
  SDK_VERSION: '0.133.0'

jobs:
  haber:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: bot
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Claude SDK'sını kur
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "@anthropic-ai/sdk@${SDK_VERSION:?SDK_VERSION boş olamaz}"
      - name: Sınama
        run: node bot/news_test.mjs
      - name: Haberleri yaz
        run: node bot/news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
