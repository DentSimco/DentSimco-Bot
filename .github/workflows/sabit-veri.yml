# DentSimco — Sabit veri botu
# Her pazartesi 02:17 UTC'de (05:17 TR) ve istediğin zaman elle çalışır.
# Güvenlik: GitHub eylemi değişmez commit numarasıyla (SHA) çağrılır.
name: DentSimco Sabit Veri

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Sim Companies'e istek atan işlerle (restoran.yml) aynı kuyruk: API kuralı 5 dakikada 1 istek.
concurrency:
  group: dentsimco-simcompanies
  cancel-in-progress: false

jobs:
  sabit-veri:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: bot
      - name: Sabit verileri topla
        run: node bot/constants.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
