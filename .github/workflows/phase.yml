name: Ekonomi Evresi
# Güvenlik: npm paketi kurulmaz (gizli anahtar dışarıdan gelen koda verilmez).
# GitHub eylemleri sürüm etiketiyle değil, değişmez commit numarasıyla (SHA) çağrılır.

on:
  schedule:
    # Türkiye saati 18:05, 18:20, 18:35 ve 19:05 (UTC 15:05, 15:20, 15:35, 16:05), sadece cuma
    - cron: "5 15 * * 5"
    - cron: "20 15 * * 5"
    - cron: "35 15 * * 5"
    - cron: "5 16 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekonomi-evresi
  cancel-in-progress: false

jobs:
  phase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            bot
            scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Evreyi çek ve kaydet
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/fetchPhase.mjs
