# DentSimco — Canlı borsa botu
# 5 dakikada bir başlar (UTC; Türkiye = UTC+3). Veri kaynakları: Simcotools API (son işlem, mumlar; saniyede en çok 2 istek) ve
# Sim Companies oyun API'si (anlık borsa fiyatı ve satış arzı: /api/v3/market/all/{realm}/{ürün}/, saniyede en çok 2 istek, ayrı sunucu).
# İki realm (0 ve 1) için yaklaşık 290 istek, 2,5-3 dakikada biter.
# Repo herkese açık olduğu için GitHub Actions dakikası sınırsız.
# Not: GitHub zamanlanmış çalışmaları yoğun saatlerde birkaç dakika geciktirebilir. Çalışmalar üst üste binmez:
# bir tur sürerken gelen yeni tur bekler (concurrency), çalışan tur iptal edilmez.
# Şirket sıralaması bu işte DEĞİL: kendi iş akışında (siralama.yml, günde bir kez, ayrı kuyruk) çalışır; borsa turu hiç uzamaz.
# DURAKLATMA: BORSA_DURAKLAT '1' iken (şu an '0': borsa açık) canlı borsa verisi toplanmaz (aşağıdaki env); Simcotools'un isteği şirket geçmişi geri doldurmasına
# kalır. Borsayı açmak için '0' yapın.
# Güvenlik: GitHub eylemi değişmez commit numarasıyla (SHA) çağrılır.
name: DentSimco Borsa

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BORSA_DURAKLAT: '0'
  # Anlık borsa (Sim Companies market/all, saniyede 2 istek, her turda ~240 istek). Acil kapatma: '0' yapın; SimcoTools verisi toplanmaya devam eder.
  ANLIK_BORSA: '1'

concurrency:
  group: dentsimco-borsa
  cancel-in-progress: false

jobs:
  borsa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: bot
      - name: Sınama (başarısız olursa veri yine toplanır, iş sonunda kırmızı biter)
        if: env.BORSA_DURAKLAT != '1'
        id: market-test
        continue-on-error: true
        run: node bot/market_test.mjs
      - name: Anlık borsa sınaması (başarısız olursa veri yine toplanır, iş sonunda kırmızı biter)
        if: env.BORSA_DURAKLAT != '1' && hashFiles('bot/exchange_test.mjs') != ''
        id: exchange-test
        continue-on-error: true
        run: node bot/exchange_test.mjs
      - name: Güvenlik sınaması, JWT yalnız Google'a gider (başarısız olursa veri yine toplanır, iş sonunda kırmızı biter)
        id: firestore-test
        continue-on-error: true
        run: node bot/firestore_test.mjs
      - name: Borsa verisini topla
        if: env.BORSA_DURAKLAT != '1'
        run: node bot/market.mjs
        env:
          ANLIK_BORSA: ${{ env.ANLIK_BORSA }}
          SIMCO_HEADER_NAME: ${{ secrets.SIMCO_HEADER_NAME }}
          SIMCO_HEADER_VALUE: ${{ secrets.SIMCO_HEADER_VALUE }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Sınama başarısızsa işi kırmızıya çevir (veri yukarıda toplandı; bildirim gelsin)
        if: ${{ always() && (steps.market-test.outcome == 'failure' || steps.exchange-test.outcome == 'failure' || steps.firestore-test.outcome == 'failure') }}
        run: |
          echo "::error::Sınama başarısız (market-test, exchange-test, firestore-test); ayrıntı ilgili adımda."
          exit 1
