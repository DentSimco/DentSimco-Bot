# DentSimco — Canlı borsa botu
# 5 dakikada bir başlar (UTC; Türkiye = UTC+3). Veri kaynağı: Simcotools API (saniyede en çok 2 istek).
# İki realm (0 ve 1) için yaklaşık 290 istek, 2,5-3 dakikada biter.
# Repo herkese açık olduğu için GitHub Actions dakikası sınırsız.
# Not: GitHub zamanlanmış çalışmaları yoğun saatlerde birkaç dakika geciktirebilir. Çalışmalar üst üste binmez:
# bir tur sürerken gelen yeni tur bekler (concurrency), çalışan tur iptal edilmez.
# Şirket sıralaması (bot/ranking.mjs) her turda borsadan SONRA, bu işin içinde yoklanır: Simcotools'ta yeni tarihli sıralama
# (00:00 UTC) çıkınca ya da aynı tarihin ayrıntıları eksik kalınca (3 saatte bir) yeniden çekilir; diğer turlarda tek istek atar.
# Böylece Simcotools'a hiçbir zaman iki iş birden istek atmaz (saniyede 2 sınırı). O gün borsa turu ~5 dakika uzar.
# DURAKLATMA: BORSA_DURAKLAT '1' iken (şu an '0': borsa açık) canlı borsa verisi toplanmaz (aşağıdaki env); Simcotools'un isteği şirket geçmişi geri doldurmasına
# kalır. Şirket sıralaması adımı (yeni gün ve günlük geçmiş birikimi) çalışmaya devam eder. Borsayı açmak için '0' yapın.
# Güvenlik: GitHub eylemi değişmez commit numarasıyla (SHA) çağrılır.
name: DentSimco Borsa

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BORSA_DURAKLAT: '0'

concurrency:
  group: dentsimco-borsa
  cancel-in-progress: false

jobs:
  borsa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: bot
      - name: Sınama (başarısız olursa uyarı verir, veri toplamayı durdurmaz)
        if: env.BORSA_DURAKLAT != '1'
        continue-on-error: true
        run: node bot/market_test.mjs
      - name: Güvenlik sınaması, JWT yalnız Google'a gider (başarısız olursa uyarı verir, veri toplamayı durdurmaz)
        continue-on-error: true
        run: node bot/firestore_test.mjs
      - name: Borsa verisini topla
        if: env.BORSA_DURAKLAT != '1'
        run: node bot/market.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Şirket sıralaması (yeni tarih çıkınca, borsadan sonra; hata verirse borsa turu başarısız sayılmaz)
        if: hashFiles('bot/ranking.mjs') != ''
        continue-on-error: true
        run: node bot/ranking.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RANKING_IF_STALE: '1'
