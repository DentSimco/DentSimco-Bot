# DentSimco — Canlı borsa botu
# 10 dakikada bir başlar (UTC; Türkiye = UTC+3). Veri kaynağı: Simcotools API (saniyede 2 istek)[span_0](start_span)[span_0](end_span).
# İki realm için yaklaşık 3-4 dakikada biter[span_1](start_span)[span_1](end_span).
# Repo herkese açık olduğu için GitHub Actions dakikası sınırsız[span_2](start_span)[span_2](end_span).
# Not: GitHub zamanlanmış çalışmaları yoğun saatlerde birkaç dakika geciktirebilir[span_3](start_span)[span_3](end_span).
name: DentSimco Borsa

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  borsa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: bot
      - name: Borsa verisini topla
        run: node bot/market.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
