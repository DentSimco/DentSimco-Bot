# DentSimco — Şirket sıralaması botu (günde bir kez, borsadan AYRI)
# Her gün bir kez çalışır (04:20 UTC = 07:20 Türkiye saati): sıralama 00:00 UTC'de yenilenir, ayrıntılar (bina, patent, işçi, tahvil)
# sabaha doğru hazır olur. Haber masası (haber.yml, 05:00 UTC) bu veriyi okuduğu için ondan ÖNCE çalışır. Sıralama isteği günde yalnız bu
# çalışmada gelir; canlı borsa turlarını (borsa.yml) hiç yavaşlatmaz.
# Borsa kuyruğundan (dentsimco-borsa) AYRI kendi kuyruğu vardır: ikisi aynı anda çalışabilir. Simcotools'un sınırı ortaksa 429 gelince
# her iki bot da kendiliğinden yavaşlar (Retry-After'a uyar). Elle de çalıştırılabilir (Actions > Run workflow).
# Güvenlik: GitHub eylemi değişmez commit numarasıyla (SHA) çağrılır.
name: DentSimco Siralama

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dentsimco-siralama
  cancel-in-progress: false

jobs:
  siralama:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: bot
      - name: Sınama (başarısız olursa veri yine toplanır, iş sonunda kırmızı biter)
        id: ranking-test
        continue-on-error: true
        run: node bot/ranking_test.mjs
      - name: Sıralamayı topla
        run: node bot/ranking.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Sınama başarısızsa işi kırmızıya çevir (veri yukarıda toplandı; bildirim gelsin)
        if: ${{ always() && (steps.ranking-test.outcome == 'failure') }}
        run: |
          echo "::error::Sınama başarısız (ranking-test); ayrıntı ilgili adımda."
          exit 1
