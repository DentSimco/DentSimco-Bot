name: Ekonomi Evresi
# Güvenlik: npm paketi kurulmaz (gizli anahtar dışarıdan gelen koda verilmez).
# GitHub eylemleri sürüm etiketiyle değil, değişmez commit numarasıyla (SHA) çağrılır.

on:
  schedule:
    # Evre cuma UTC 15:00'te (TR 18:00) değişir; Simcotools yeni evreyi geç yayınlayabilir.
    # Bu yüzden cuma UTC 15:05-18:55 arası her 10 dakikada bir bakılır (yeni evre gelince yazılır, gelene dek "zaten güncel/yayınlanmamış" der).
    - cron: "5,15,25,35,45,55 15-18 * * 5"
  workflow_dispatch:
    inputs:
      r0:
        description: "Realm 0 evresini elle yaz (Simcotools gecikirse). Boş = Simcotools'tan çek"
        type: choice
        options: ["", recession, normal, boom]
        default: ""
      r1:
        description: "Realm 1 evresini elle yaz (Simcotools gecikirse). Boş = Simcotools'tan çek"
        type: choice
        options: ["", recession, normal, boom]
        default: ""

permissions:
  contents: read

concurrency:
  group: ekonomi-evresi
  cancel-in-progress: false

jobs:
  phase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            bot
            scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Evreyi çek ve kaydet
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PHASE_OVERRIDE_R0: ${{ inputs.r0 }}
          PHASE_OVERRIDE_R1: ${{ inputs.r1 }}
        run: node scripts/fetchPhase.mjs
