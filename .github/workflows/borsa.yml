# DentSimco — Canlı borsa botu
# 5 dakikada bir başlar (UTC; Türkiye = UTC+3). Veri kaynağı: Simcotools API (saniyede en çok 2 istek).
# İki realm (0 ve 1) için yaklaşık 290 istek, 2,5-3 dakikada biter.
# Repo herkese açık olduğu için GitHub Actions dakikası sınırsız.
# Not: GitHub zamanlanmış çalışmaları yoğun saatlerde birkaç dakika geciktirebilir. Çalışmalar üst üste binmez:
# bir tur sürerken gelen yeni tur bekler (concurrency), çalışan tur iptal edilmez.
# Şirket sıralaması (bot/ranking.mjs) günde bir kez, 09:00 UTC'den sonraki ilk turda bu işin içinde, borsa çekildikten SONRA
# çalışır; böylece Simcotools'a hiçbir zaman iki iş birden istek atmaz (saniyede 2 sınırı). O gün borsa turu ~5 dakika uzar.
# Güvenlik: GitHub eylemi değişmez commit numarasıyla (SHA) çağrılır.
name: DentSimco Borsa

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dentsimco-borsa
  cancel-in-progress: false

jobs:
  borsa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: bot
      - name: Sınama (başarısız olursa uyarı verir, veri toplamayı durdurmaz)
        continue-on-error: true
        run: node bot/market_test.mjs
      - name: Borsa verisini topla
        run: node bot/market.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Şirket sıralaması (günde bir kez, borsadan sonra; hata verirse borsa turu başarısız sayılmaz)
        if: github.event_name == 'schedule' && hashFiles('bot/ranking.mjs') != ''
        continue-on-error: true
        run: |
          if [ "$(date -u +%H)" = "09" ]; then node bot/ranking.mjs; else echo "Sıralama saati değil (09 UTC)."; fi
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RANKING_IF_STALE: '1'
