# DentSimco — Sabit veri botu
# Her pazartesi 02:17 UTC'de (05:17 TR) ve istediğin zaman elle çalışır.
# Güvenlik: GitHub eylemi değişmez commit numarasıyla (SHA) çağrılır.
name: DentSimco Sabit Veri

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sabit-veri:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: bot
      - name: Sabit verileri topla
        run: node bot/constants.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
